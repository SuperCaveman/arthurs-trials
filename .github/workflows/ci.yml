name: Validate portfolio foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arthurs-trials-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-and-iac:
    name: API tests and zero-resource IaC plan
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test local session API
        working-directory: api
        run: |
          npm ci
          npm test

      - name: Validate player-safe capacity exhaustion contract
        run: node scripts/Test-SessionCapacityContract.mjs

      - name: Validate GameLift queue-placement API contract
        run: node scripts/Test-GameLiftQueueAdapterContract.mjs

      - name: Validate architecture visual contract
        run: node scripts/Test-ArchitectureDiagram.mjs

      - name: Exercise the local API benchmark
        run: node scripts/Run-SessionApiLoadTest.mjs

      - name: Verify bounded local placement simulation
        run: node scripts/Test-PlacementLoadSimulation.mjs

      - name: Verify local virtual-production asset workflow
        run: node scripts/Test-VirtualProductionAssetFlow.mjs

      - name: Verify virtual-production workflow dashboard
        run: node scripts/Test-VirtualProductionDashboard.mjs

      - name: Verify virtual-production recovery dashboard
        run: node scripts/Test-VirtualProductionRecoveryDashboard.mjs

      - name: Verify virtual-production rollback workflow
        run: node scripts/Test-VirtualProductionRollback.mjs

      - name: Verify virtual-production approval authorization
        run: node scripts/Test-VirtualProductionApproval.mjs

      - name: Validate virtual-production Terraform contract
        run: node scripts/Test-VirtualProductionTerraformContract.mjs

      - name: Validate GameLift container template
        run: node scripts/Test-GameLiftContainerTemplate.mjs

      - name: Validate Linux server image recipe
        run: node scripts/Test-LinuxServerContainerRecipe.mjs

      - name: Validate GameLift health fault-injection contract
        run: node scripts/Test-GameLiftHealthFaultInjection.mjs

      - name: Validate FlexMatch rule-set template
        run: node scripts/Test-FlexMatchRuleSet.mjs

      - name: Validate GameLift capacity and placement templates
        run: node scripts/Test-GameLiftCapacityTemplates.mjs

      - name: Validate GameLift capacity model
        run: node scripts/Test-GameLiftCapacityModel.mjs

      - name: Validate authoritative match-results contract
        run: node scripts/Test-AuthoritativeMatchResultsContract.mjs

      - name: Validate local operations dashboard sanitization
        run: node scripts/Test-LocalOperationsDashboard.mjs

      - name: Validate security and delivery foundation
        run: node scripts/Test-SecurityDeliveryFoundation.mjs

      - name: Validate asynchronous-results Terraform contract
        run: node scripts/Test-AsyncResultsTerraformContract.mjs

      - name: Validate database Terraform contract
        run: node scripts/Test-DatabaseTerraformContract.mjs

      - name: Test local match-results worker
        working-directory: worker
        run: |
          npm ci
          npm test

      - name: Verify results-worker resilience simulation
        run: node scripts/Test-ResultsWorkerResilienceSimulation.mjs

      - name: Validate results-worker managed runtime template
        run: node scripts/Test-ResultsWorkerRuntimeContract.mjs

      - name: Validate observability Terraform contract
        run: node scripts/Test-ObservabilityTerraformContract.mjs

      - name: Validate release-candidate workflow boundary
        run: node scripts/Test-ReleaseCandidateWorkflow.mjs

      - name: Validate session API container and SDK contract
        run: node scripts/Test-SessionApiContainerContract.mjs

      - name: Build session API container
        working-directory: api
        run: docker build --tag arthurs-trials-session-api:ci .

      - name: Validate results-worker container contract
        run: node scripts/Test-ResultsWorkerContainer.mjs

      - name: Build results-worker container
        working-directory: worker
        run: docker build --tag arthurs-trials-results-worker:ci .

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Format and validate Terraform
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform fmt -check -recursive
          terraform validate

      - name: Prove the default IaC plan is resource-free
        working-directory: infra
        env:
          # Deliberately fake values: local-mode provider validation is disabled
          # and this workflow must never make AWS control-plane calls.
          AWS_ACCESS_KEY_ID: local-ci-only
          AWS_SECRET_ACCESS_KEY: local-ci-only
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set +e
          terraform plan -input=false -lock=false -detailed-exitcode \
            -out="$RUNNER_TEMP/arthurs-trials-local.tfplan"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          terraform show -json "$RUNNER_TEMP/arthurs-trials-local.tfplan" \
            > "$RUNNER_TEMP/arthurs-trials-local-plan.json"
          node scripts/assert-local-plan.mjs \
            "$RUNNER_TEMP/arthurs-trials-local-plan.json"
