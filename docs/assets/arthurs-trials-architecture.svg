<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Arthur's Trials game-development multiplayer platform architecture</title>
  <desc id="desc">A two-lane architecture diagram for game-development teams. The upper lane shows the locally verified Unreal and GameLift Servers Anywhere proof. The lower lane shows the default-off planned managed AWS architecture with Cognito, an ALB, ECS session API and results worker, GameLift queues and managed container fleets, SQS, RDS, CloudWatch and CI release evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101c32"/></linearGradient>
    <linearGradient id="verified" x1="0" x2="1"><stop stop-color="#163e47"/><stop offset="1" stop-color="#145060"/></linearGradient>
    <linearGradient id="planned" x1="0" x2="1"><stop stop-color="#1d2a50"/><stop offset="1" stop-color="#3a295b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#51d6c9"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b99cff"/></marker>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #f5f8ff; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #b8c7dd; }
      .lane { font: 700 21px Arial, sans-serif; fill: #f5f8ff; letter-spacing: .4px; }
      .laneNote { font: 400 15px Arial, sans-serif; fill: #c6d4e8; }
      .boxTitle { font: 700 18px Arial, sans-serif; fill: #f7fbff; }
      .boxText { font: 400 14px Arial, sans-serif; fill: #d4e2ef; }
      .small { font: 400 13px Arial, sans-serif; fill: #bdcbe0; }
      .tag { font: 700 12px Arial, sans-serif; fill: #07111f; letter-spacing: .6px; }
      .legend { font: 600 14px Arial, sans-serif; fill: #d8e5f3; }
    </style>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/>
  <text x="70" y="74" class="title">Arthur's Trials — Game Development Multiplayer Platform</text>
  <text x="70" y="108" class="subtitle">For game-development teams: verified local GameLift lifecycle above, default-off managed AWS design below.</text>

  <rect x="60" y="145" width="1480" height="350" rx="24" fill="url(#verified)" stroke="#51d6c9" stroke-width="2" filter="url(#shadow)"/>
  <rect x="90" y="170" width="106" height="28" rx="14" fill="#51d6c9"/>
  <text x="109" y="189" class="tag">VERIFIED LOCALLY</text>
  <text x="220" y="191" class="lane">GameLift Servers Anywhere proof</text>
  <text x="220" y="215" class="laneNote">Dedicated server lifecycle, secure player admission, authoritative match results, health-failure recovery.</text>

  <g filter="url(#shadow)">
    <rect x="115" y="272" width="220" height="130" rx="16" fill="#0d2838" stroke="#72eee1"/>
    <text x="140" y="310" class="boxTitle">Unreal client</text><text x="140" y="337" class="boxText">Local player</text><text x="140" y="360" class="boxText">No AWS credentials</text>
    <rect x="445" y="272" width="250" height="130" rx="16" fill="#0d2838" stroke="#72eee1"/>
    <text x="470" y="310" class="boxTitle">Session API</text><text x="470" y="337" class="boxText">Ownership + idempotency</text><text x="470" y="360" class="boxText">Player-session handoff</text>
    <rect x="805" y="252" width="300" height="170" rx="16" fill="#0d2838" stroke="#72eee1"/>
    <text x="830" y="290" class="boxTitle">GameLift Servers Anywhere</text><text x="830" y="317" class="boxText">Real fleet / registered compute</text><text x="830" y="340" class="boxText">ProcessReady + health checks</text><text x="830" y="363" class="boxText">Game session + player session</text><text x="830" y="386" class="boxText">Graceful ProcessEnding</text>
    <rect x="1215" y="272" width="250" height="130" rx="16" fill="#0d2838" stroke="#72eee1"/>
    <text x="1240" y="310" class="boxTitle">Unreal dedicated server</text><text x="1240" y="337" class="boxText">AcceptPlayerSession</text><text x="1240" y="360" class="boxText">Server-authoritative result</text>
  </g>
  <path d="M335 337 H445" stroke="#51d6c9" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <path d="M695 337 H805" stroke="#51d6c9" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <path d="M1105 337 H1215" stroke="#51d6c9" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <path d="M1340 425 C1340 458 975 458 975 430" fill="none" stroke="#51d6c9" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow-teal)"/>
  <text x="1050" y="470" class="small">authoritative match.completed → local idempotent worker</text>

  <rect x="60" y="535" width="1480" height="430" rx="24" fill="url(#planned)" stroke="#b99cff" stroke-width="2" filter="url(#shadow)"/>
  <rect x="90" y="560" width="176" height="28" rx="14" fill="#b99cff"/>
  <text x="106" y="579" class="tag">DEFAULT-OFF DESIGN</text>
  <text x="288" y="581" class="lane">Approved, time-boxed managed AWS demonstration</text>
  <text x="288" y="605" class="laneNote">Terraform-gated templates; intentionally no always-on fleet, database, queue, task, or dashboard.</text>

  <g filter="url(#shadow)">
    <rect x="100" y="670" width="190" height="125" rx="16" fill="#202650" stroke="#cfbbff"/>
    <text x="125" y="708" class="boxTitle">Unreal client</text><text x="125" y="735" class="boxText">Cognito access token</text><text x="125" y="758" class="boxText">Measured latency</text>
    <rect x="370" y="650" width="230" height="165" rx="16" fill="#202650" stroke="#cfbbff"/>
    <text x="395" y="688" class="boxTitle">Public ALB</text><text x="395" y="715" class="boxText">TLS edge</text><text x="395" y="738" class="boxText">Private API target</text><text x="395" y="780" class="boxTitle">Cognito</text>
    <rect x="685" y="650" width="250" height="165" rx="16" fill="#202650" stroke="#cfbbff"/>
    <text x="710" y="688" class="boxTitle">ECS/Fargate session API</text><text x="710" y="715" class="boxText">JWT + party boundary</text><text x="710" y="738" class="boxText">Queue placement adapter</text><text x="710" y="761" class="boxText">No client AWS access</text>
    <rect x="1020" y="650" width="240" height="165" rx="16" fill="#202650" stroke="#cfbbff"/>
    <text x="1045" y="688" class="boxTitle">GameLift Servers</text><text x="1045" y="715" class="boxText">Latency-aware queue</text><text x="1045" y="738" class="boxText">Fleet alias + capacity</text><text x="1045" y="761" class="boxText">Managed Linux container</text>
    <rect x="1335" y="650" width="160" height="165" rx="16" fill="#202650" stroke="#cfbbff"/>
    <text x="1360" y="688" class="boxTitle">Dedicated</text><text x="1360" y="713" class="boxTitle">server</text><text x="1360" y="742" class="boxText">Lifecycle</text><text x="1360" y="765" class="boxText">admission</text>
    <rect x="685" y="860" width="210" height="72" rx="16" fill="#202650" stroke="#cfbbff"/>
    <text x="710" y="892" class="boxTitle">SQS + DLQ</text><text x="710" y="916" class="boxText">At-least-once results</text>
    <rect x="1000" y="850" width="230" height="92" rx="16" fill="#202650" stroke="#cfbbff"/>
    <text x="1025" y="882" class="boxTitle">ECS/Fargate worker</text><text x="1025" y="907" class="boxText">Receipt + XP transaction</text>
    <rect x="1335" y="850" width="160" height="92" rx="16" fill="#202650" stroke="#cfbbff"/>
    <text x="1360" y="882" class="boxTitle">Private RDS</text><text x="1360" y="907" class="boxText">PostgreSQL</text>
  </g>
  <path d="M290 733 H370" stroke="#b99cff" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <path d="M600 733 H685" stroke="#b99cff" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <path d="M935 733 H1020" stroke="#b99cff" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <path d="M1260 733 H1335" stroke="#b99cff" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <path d="M1415 815 V850" stroke="#b99cff" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <path d="M1335 896 H1230" stroke="#b99cff" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <path d="M1000 896 H895" stroke="#b99cff" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <path d="M1415 815 C1415 835 790 835 790 860" fill="none" stroke="#b99cff" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow-purple)"/>

  <rect x="60" y="992" width="1480" height="42" rx="12" fill="#0b182a" stroke="#29435e"/>
  <circle cx="94" cy="1013" r="7" fill="#51d6c9"/><text x="110" y="1018" class="legend">Working local proof</text>
  <circle cx="315" cy="1013" r="7" fill="#b99cff"/><text x="331" y="1018" class="legend">Default-off managed architecture</text>
  <text x="825" y="1018" class="legend">Cost posture: managed services stay off until an explicitly approved, time-boxed demo.</text>
</svg>
