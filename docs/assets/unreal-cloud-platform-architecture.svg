<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Arthur's Trials Unreal Engine Cloud Platform on AWS</title>
  <desc id="desc">A three-lane architecture diagram. The first two lanes show verified local multiplayer and virtual-production workflows. The third lane shows their shared default-off AWS platform design with GameLift Servers, private versioned assets, approval metadata, event-driven intake validation, and read-only local-stage delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#06111e"/><stop offset="1" stop-color="#121b38"/></linearGradient>
    <linearGradient id="gaming" x1="0" x2="1"><stop stop-color="#123f4b"/><stop offset="1" stop-color="#17556a"/></linearGradient>
    <linearGradient id="vp" x1="0" x2="1"><stop stop-color="#3c294f"/><stop offset="1" stop-color="#62415c"/></linearGradient>
    <linearGradient id="cloud" x1="0" x2="1"><stop stop-color="#1d2958"/><stop offset="1" stop-color="#3d2f64"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".34"/></filter>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#5ce0cf"/></marker><marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#e3a6ff"/></marker><marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#bda5ff"/></marker>
    <style>.t{font:700 42px Arial,sans-serif;fill:#f5f8ff}.st{font:400 18px Arial,sans-serif;fill:#b9c9df}.l{font:700 21px Arial,sans-serif;fill:#f8fbff}.n{font:400 15px Arial,sans-serif;fill:#cbd9ea}.bt{font:700 17px Arial,sans-serif;fill:#f8fbff}.bx{font:400 13px Arial,sans-serif;fill:#d5e4f1}.tag{font:700 12px Arial,sans-serif;fill:#07111f;letter-spacing:.55px}.leg{font:600 14px Arial,sans-serif;fill:#d8e6f4}</style>
  </defs>
  <rect width="1600" height="1180" fill="url(#bg)"/>
  <text x="70" y="72" class="t">Arthur's Trials — Unreal Engine Cloud Platform on AWS</text><text x="70" y="106" class="st">Two verified local workflow proofs share one secure, cost-controlled AWS platform design.</text>
  <rect x="60" y="142" width="1480" height="230" rx="23" fill="url(#gaming)" stroke="#5ce0cf" stroke-width="2" filter="url(#s)"/><rect x="90" y="166" width="148" height="28" rx="14" fill="#5ce0cf"/><text x="108" y="185" class="tag">VERIFIED LOCALLY</text><text x="260" y="187" class="l">Multiplayer / GameLift Servers Anywhere</text><text x="260" y="211" class="n">Real Unreal dedicated-server lifecycle, secure player admission, authoritative results, and graceful shutdown.</text>
  <g filter="url(#s)"><rect x="120" y="260" width="210" height="75" rx="15" fill="#0d293c" stroke="#75eee1"/><text x="143" y="291" class="bt">Unreal client</text><text x="143" y="314" class="bx">No AWS credentials</text><rect x="440" y="260" width="220" height="75" rx="15" fill="#0d293c" stroke="#75eee1"/><text x="464" y="291" class="bt">Session API</text><text x="464" y="314" class="bx">Player-session handoff</text><rect x="770" y="248" width="280" height="100" rx="15" fill="#0d293c" stroke="#75eee1"/><text x="794" y="280" class="bt">GameLift Servers Anywhere</text><text x="794" y="303" class="bx">ProcessReady · health · sessions</text><text x="794" y="325" class="bx">Graceful ProcessEnding</text><rect x="1160" y="260" width="260" height="75" rx="15" fill="#0d293c" stroke="#75eee1"/><text x="1184" y="291" class="bt">Unreal dedicated server</text><text x="1184" y="314" class="bx">Authoritative result</text></g><path d="M330 298H440M660 298H770M1050 298H1160" fill="none" stroke="#5ce0cf" stroke-width="4" marker-end="url(#a1)"/>
  <rect x="60" y="403" width="1480" height="230" rx="23" fill="url(#vp)" stroke="#e3a6ff" stroke-width="2" filter="url(#s)"/><rect x="90" y="427" width="148" height="28" rx="14" fill="#e3a6ff"/><text x="108" y="446" class="tag">VERIFIED LOCALLY</text><text x="260" y="448" class="l">Virtual production / local stage workflow</text><text x="260" y="472" class="n">Remote Unreal content moves through validation, authorized approval, deployment, audit, and recoverable rollback.</text>
  <g filter="url(#s)"><rect x="120" y="521" width="220" height="75" rx="15" fill="#2a1d3c" stroke="#f0b7ff"/><text x="144" y="552" class="bt">Remote Unreal artist</text><text x="144" y="575" class="bx">Castle_Set_v12 publish</text><rect x="445" y="521" width="235" height="75" rx="15" fill="#2a1d3c" stroke="#f0b7ff"/><text x="469" y="552" class="bt">Validation + approval</text><text x="469" y="575" class="bx">Role-gated local proof</text><rect x="785" y="521" width="245" height="75" rx="15" fill="#2a1d3c" stroke="#f0b7ff"/><text x="809" y="552" class="bt">Audit + rollback ledger</text><text x="809" y="575" class="bx">Idempotent status history</text><rect x="1135" y="521" width="285" height="75" rx="15" fill="#2a1d3c" stroke="#f0b7ff"/><text x="1159" y="552" class="bt">Local stage workstation</text><text x="1159" y="575" class="bx">Real-time render stays local</text></g><path d="M340 559H445M680 559H785M1030 559H1135" fill="none" stroke="#e3a6ff" stroke-width="4" marker-end="url(#a2)"/>
  <rect x="60" y="664" width="1480" height="390" rx="23" fill="url(#cloud)" stroke="#bda5ff" stroke-width="2" filter="url(#s)"/><rect x="90" y="688" width="184" height="28" rx="14" fill="#bda5ff"/><text x="106" y="707" class="tag">DEFAULT-OFF DESIGN</text><text x="296" y="709" class="l">Shared AWS platform — explicit demo gate, expiry tag, zero resources in local mode</text><text x="296" y="733" class="n">No persistent GPU/render fleet, NAT gateway, or managed GameLift capacity by default.</text>
  <g filter="url(#s)"><rect x="105" y="790" width="215" height="90" rx="15" fill="#202653" stroke="#cfbcff"/><text x="129" y="823" class="bt">Gaming control plane</text><text x="129" y="847" class="bx">Cognito · ALB · ECS API</text><text x="129" y="869" class="bx">GameLift placement</text><rect x="380" y="790" width="215" height="90" rx="15" fill="#202653" stroke="#cfbcff"/><text x="404" y="823" class="bt">GameLift Servers</text><text x="404" y="847" class="bx">Queue + container fleet</text><text x="404" y="869" class="bx">Approved demo only</text><rect x="655" y="790" width="215" height="90" rx="15" fill="#202653" stroke="#cfbcff"/><text x="679" y="823" class="bt">Results + data</text><text x="679" y="847" class="bx">SQS/DLQ · worker · RDS</text><text x="679" y="869" class="bx">Idempotent receipt</text><rect x="930" y="790" width="215" height="90" rx="15" fill="#202653" stroke="#cfbcff"/><text x="954" y="823" class="bt">VP version control</text><text x="954" y="847" class="bx">Private versioned S3</text><text x="954" y="869" class="bx">DynamoDB approvals</text><rect x="1205" y="790" width="285" height="90" rx="15" fill="#202653" stroke="#cfbcff"/><text x="1229" y="823" class="bt">VP event-driven intake</text><text x="1229" y="847" class="bx">S3 → EventBridge → Step Functions</text><text x="1229" y="869" class="bx">Read-only stage delivery</text><rect x="440" y="934" width="300" height="70" rx="15" fill="#202653" stroke="#cfbcff"/><text x="465" y="964" class="bt">Observability + audit</text><text x="465" y="987" class="bx">CloudWatch logs, dashboards, alarms</text><rect x="860" y="934" width="300" height="70" rx="15" fill="#202653" stroke="#cfbcff"/><text x="885" y="964" class="bt">Terraform + GitHub Actions</text><text x="885" y="987" class="bx">Tests, zero-plan, release evidence</text></g><path d="M320 835H380M595 835H655M870 835H930M1145 835H1205" fill="none" stroke="#bda5ff" stroke-width="4" marker-end="url(#a3)"/><path d="M762 880V934M1067 880V934" fill="none" stroke="#bda5ff" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a3)"/>
  <rect x="60" y="1080" width="1480" height="44" rx="12" fill="#0b182a" stroke="#29435e"/><circle cx="94" cy="1102" r="7" fill="#5ce0cf"/><text x="110" y="1107" class="leg">Verified local multiplayer proof</text><circle cx="374" cy="1102" r="7" fill="#e3a6ff"/><text x="390" y="1107" class="leg">Verified local virtual-production proof</text><circle cx="720" cy="1102" r="7" fill="#bda5ff"/><text x="736" y="1107" class="leg">Validated default-off AWS design</text><text x="1050" y="1107" class="leg">No managed resources deployed</text>
</svg>
